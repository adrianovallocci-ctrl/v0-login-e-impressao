name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Mesma versão que rodou os portões nesta máquina. Next 16.2 aceita >=20.9.0.
          node-version: "26.0.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
